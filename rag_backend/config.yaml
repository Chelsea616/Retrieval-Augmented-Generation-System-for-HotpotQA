top_k: 10

# --- Generation Configuration ---
# Settings for the generative LLM.
generation:
  model_name: "Qwen/Qwen2.5-0.5B-Instruct"
  cache_dir: "D:/huggingface_cache/hub" 
  generation_params:
    max_new_tokens: 250
    temperature: 0.7
    top_p: 0.8
    repetition_penalty: 1.05
# --- Output Configuration ---
# Path for the final prediction file.
output:
  train_prediction_file: "result/train_prediction.jsonl"
  val_prediction_file: "result/val_prediction.jsonl"
  test_prediction_file: "result/test_prediction.jsonl"
